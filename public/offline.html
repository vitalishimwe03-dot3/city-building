<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Offline - City Building Engineering</title>
  <meta name="theme-color" content="#0891b2">
  <link rel="icon" type="image/png" href="/icons/icon-96.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: Inter, -apple-system, "Segoe UI", sans-serif; background: #0a1628; color: #e2e8f0; }
    .card { width: 100%; max-width: 420px; text-align: center; background: #121c2b; border: 1px solid #1e3a5f; border-radius: 18px; padding: 36px 28px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
    img { width: 84px; height: 84px; border-radius: 18px; margin-bottom: 18px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
    button, a { display: inline-block; border: 0; cursor: pointer; border-radius: 10px; padding: 11px 22px; font-size: 14px; font-weight: 700; text-decoration: none; }
    button { background: #0891b2; color: #fff; }
    a { color: #67e8f9; margin-left: 10px; }
    .hint { margin-top: 22px; font-size: 12px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="City Building">
    <h1>You are offline</h1>
    <p>Check your internet connection and try again. Pages you visited before may still be available from your device.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
    <a href="/">Go home</a>
    <div class="hint">City Building Engineering Company Ltd</div>
  </div>
</body>
</html>
